<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f5ff;
    --blue: #0066ff;
    --glow: 0 0 10px #00f5ff, 0 0 25px #00f5ff, 0 0 50px #0066ff;
    --glow-sm: 0 0 6px #00f5ff, 0 0 12px #0066ff;
    --red: #ff4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#000510; color:var(--cyan); font-family:'Share Tech Mono',monospace; overflow:hidden; }

  body::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(0,245,255,0.04) 1px,transparent 1px), linear-gradient(90deg,rgba(0,245,255,0.04) 1px,transparent 1px);
    background-size:36px 36px; animation:grid 18s linear infinite; pointer-events:none; z-index:0;
  }
  @keyframes grid { to { transform:translateY(36px); } }
  body::after {
    content:''; position:fixed; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    animation:scan 5s linear infinite; opacity:0.2; pointer-events:none; z-index:1;
  }
  @keyframes scan { 0%{top:-2px} 100%{top:100%} }

  /* ── KEY SCREEN ── */
  #keyScreen {
    position:fixed; inset:0; z-index:100;
    background:#000510;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; padding:30px;
  }
  #keyScreen .ring {
    width:80px; height:80px; border-radius:50%;
    border:2px solid var(--cyan);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--glow), inset 0 0 20px rgba(0,245,255,0.1);
    animation:spin 10s linear infinite; position:relative; flex-shrink:0;
  }
  #keyScreen .ring::before {
    content:''; position:absolute; width:52px; height:52px; border-radius:50%;
    border:1px solid rgba(0,245,255,0.35); animation:spin 5s linear infinite reverse;
  }
  #keyScreen .core { width:20px; height:20px; border-radius:50%; background:radial-gradient(circle,var(--cyan),var(--blue)); box-shadow:var(--glow); }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  #keyScreen h1 { font-family:'Orbitron',monospace; font-size:1.1rem; letter-spacing:0.3em; text-shadow:var(--glow-sm); text-align:center; }
  #keyScreen p { font-size:0.72rem; opacity:0.5; text-align:center; line-height:1.9; letter-spacing:0.05em; }
  #keyScreen a { color:var(--cyan); }
  #keyInput {
    width:100%; background:rgba(0,245,255,0.05);
    border:1px solid rgba(0,245,255,0.3); border-radius:10px;
    color:var(--cyan); font-family:'Share Tech Mono',monospace;
    font-size:0.85rem; padding:14px 16px; outline:none;
    -webkit-appearance:none; letter-spacing:0.05em;
  }
  #keyInput:focus { border-color:var(--cyan); box-shadow:var(--glow-sm); }
  #keyInput::placeholder { color:rgba(0,245,255,0.25); }
  #keyBtn {
    width:100%; background:rgba(0,245,255,0.08);
    border:1px solid var(--cyan); color:var(--cyan);
    font-family:'Orbitron',monospace; font-size:0.75rem; font-weight:700;
    letter-spacing:0.15em; padding:16px; border-radius:10px;
    cursor:pointer; box-shadow:var(--glow-sm); transition:all 0.2s;
  }
  #keyBtn:active { background:rgba(0,245,255,0.18); transform:scale(0.97); }
  #keyErr { color:var(--red); font-size:0.65rem; letter-spacing:0.1em; display:none; }

  /* ── MAIN APP ── */
  .app { position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

  .header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid rgba(0,245,255,0.15); flex-shrink:0; }
  .logo { font-family:'Orbitron',monospace; font-size:1.25rem; font-weight:900; letter-spacing:0.25em; text-shadow:var(--glow-sm); animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .hdr-right { display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#00ff88; box-shadow:0 0 8px #00ff88; animation:blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
  .online { font-size:0.6rem; letter-spacing:0.15em; opacity:0.55; }

  .chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding:16px 16px 8px; -webkit-overflow-scrolling:touch; }
  .chat::-webkit-scrollbar { display:none; }

  .msg { display:flex; flex-direction:column; gap:5px; animation:up 0.3s ease; }
  @keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { align-items:flex-end; }
  .msg.ai   { align-items:flex-start; }
  .msg-lbl { font-size:0.58rem; letter-spacing:0.2em; opacity:0.4; padding:0 6px; }
  .bubble { max-width:88%; padding:13px 16px; font-size:0.92rem; line-height:1.7; }
  .msg.user .bubble { background:rgba(0,102,255,0.14); border:1px solid rgba(0,102,255,0.4); border-radius:16px 16px 4px 16px; color:#99ccff; }
  .msg.ai .bubble { background:rgba(0,245,255,0.05); border:1px solid rgba(0,245,255,0.2); border-radius:4px 16px 16px 16px; color:var(--cyan); }
  .msg.ai .bubble::before { content:'> '; color:var(--blue); font-weight:bold; }

  .thinking { display:flex; align-items:center; gap:8px; padding:13px 16px; font-size:0.75rem; letter-spacing:0.15em; opacity:0.65; border:1px solid rgba(0,245,255,0.18); border-radius:4px 16px 16px 16px; background:rgba(0,245,255,0.03); }
  .dots span { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cyan); margin:0 2px; animation:db 1.2s ease-in-out infinite; }
  .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @keyframes db { 0%,100%{transform:translateY(0);opacity:.3} 50%{transform:translateY(-6px);opacity:1} }

  .welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px 20px; }
  .w-ring { width:90px; height:90px; border-radius:50%; border:2px solid var(--cyan); display:flex; align-items:center; justify-content:center; box-shadow:var(--glow),inset 0 0 20px rgba(0,245,255,0.1); animation:spin 10s linear infinite; position:relative; }
  .w-ring::before { content:''; position:absolute; width:60px; height:60px; border-radius:50%; border:1px solid rgba(0,245,255,0.35); animation:spin 5s linear infinite reverse; }
  .w-core { width:22px; height:22px; border-radius:50%; background:radial-gradient(circle,var(--cyan),var(--blue)); box-shadow:var(--glow); }
  .welcome h2 { font-family:'Orbitron',monospace; font-size:1rem; letter-spacing:0.3em; text-shadow:var(--glow-sm); }
  .welcome p { font-size:0.78rem; opacity:0.45; line-height:1.9; }
  .cmds { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:4px; }
  .cmd { background:rgba(0,245,255,0.05); border:1px solid rgba(0,245,255,0.2); color:var(--cyan); font-family:'Share Tech Mono',monospace; font-size:0.72rem; padding:11px 16px; border-radius:8px; cursor:pointer; letter-spacing:0.08em; min-height:44px; }
  .cmd:active { background:rgba(0,245,255,0.14); box-shadow:var(--glow-sm); }

  .bottom { flex-shrink:0; border-top:1px solid rgba(0,245,255,0.12); padding:12px 16px 16px; display:flex; flex-direction:column; gap:12px; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; font-size:0.6rem; letter-spacing:0.1em; }
  .statusbar span { opacity:0.4; }
  #micStatus { opacity:1 !important; font-size:0.65rem; }

  .mic-wrap { display:flex; flex-direction:column; align-items:center; gap:7px; }
  #bigMic { width:76px; height:76px; border-radius:50%; border:2px solid var(--cyan); background:rgba(0,245,255,0.06); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:2rem; box-shadow:var(--glow-sm); transition:all 0.2s; user-select:none; }
  #bigMic:active { transform:scale(0.94); }
  #bigMic.listening { border-color:var(--red); background:rgba(255,50,50,0.15); box-shadow:0 0 15px #ff3333,0 0 35px #ff0000; animation:mp 0.9s ease-in-out infinite; }
  @keyframes mp { 0%,100%{transform:scale(1)} 50%{transform:scale(1.09)} }
  .mic-hint { font-size:0.58rem; letter-spacing:0.14em; opacity:0.3; }

  .input-row { display:flex; gap:10px; align-items:flex-end; }
  .inp-wrap { flex:1; position:relative; }
  .inp-wrap::before { content:'//'; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--blue); font-size:0.75rem; opacity:0.55; pointer-events:none; }
  textarea { width:100%; background:rgba(0,245,255,0.04); border:1px solid rgba(0,245,255,0.25); border-radius:10px; color:var(--cyan); font-family:'Share Tech Mono',monospace; font-size:1rem; padding:13px 13px 13px 34px; resize:none; outline:none; min-height:50px; max-height:110px; line-height:1.4; -webkit-appearance:none; transition:border-color 0.2s,box-shadow 0.2s; }
  textarea::placeholder { color:rgba(0,245,255,0.2); }
  textarea:focus { border-color:var(--cyan); box-shadow:var(--glow-sm); }
  #sendBtn { background:transparent; border:1px solid var(--cyan); color:var(--cyan); font-family:'Orbitron',monospace; font-size:0.65rem; font-weight:700; letter-spacing:0.08em; padding:0 18px; height:50px; border-radius:10px; cursor:pointer; box-shadow:var(--glow-sm); min-width:72px; transition:all 0.15s; }
  #sendBtn:active { background:rgba(0,245,255,0.14); transform:scale(0.96); }
  #sendBtn:disabled { opacity:0.3; }
</style>
</head>
<body>

<!-- API KEY SCREEN -->
<div id="keyScreen">
  <div class="ring"><div class="core"></div></div>
  <h1>J.A.R.V.I.S</h1>
  <p>A free Gemini API key is required.<br>
    Get one free at:<br>
    <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
  </p>
  <input id="keyInput" type="password" placeholder="Paste your Gemini API key here..." autocomplete="off" />
  <div id="keyErr">⚠ Invalid key or network error. Try again.</div>
  <button id="keyBtn" onclick="saveKey()">INITIALISE JARVIS →</button>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" style="display:none">
  <div class="header">
    <div class="logo">J.A.R.V.I.S</div>
    <div class="hdr-right">
      <div class="dot"></div>
      <span class="online">ONLINE</span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="w-ring"><div class="w-core"></div></div>
      <h2>GOOD DAY, SIR</h2>
      <p>Online and ready.<br>Tap the mic or type below.</p>
      <div class="cmds">
        <button class="cmd" onclick="quickSend('What can you do?')">CAPABILITIES</button>
        <button class="cmd" onclick="quickSend('Tell me something interesting')">INTEL BRIEF</button>
        <button class="cmd" onclick="quickSend('Write me a poem about Iron Man')">CREATIVE MODE</button>
        <button class="cmd" onclick="quickSend('Give me a motivational speech')">MOTIVATE ME</button>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="statusbar">
      <span id="msgCount">MSGS: 0</span>
      <span id="micStatus">TAP MIC TO SPEAK</span>
      <span id="clock"></span>
    </div>
    <div class="mic-wrap">
      <div id="bigMic" onclick="toggleMic()">🎤</div>
      <div class="mic-hint">TAP TO SPEAK · TAP AGAIN TO STOP</div>
    </div>
    <div class="input-row">
      <div class="inp-wrap">
        <textarea id="userInput" placeholder="Or type here, sir..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>
</div>

<script>
  const SYS = `You are J.A.R.V.I.S. (Just A Rather Very Intelligent System), Tony Stark's AI assistant. You are incredibly capable, witty, and slightly sarcastic but always helpful. You speak in a refined, British-influenced manner. Address the user as "sir" or "ma'am". Keep responses concise but impactful.`;

  let API_KEY = localStorage.getItem('jarvis_key') || '';
  let msgs = [], count = 0, recog = null, listening = false, speaking = false;

  // Show main app if key already saved
  if (API_KEY) showApp();

  function saveKey() {
    const k = document.getElementById('keyInput').value.trim();
    if (!k) { showErr('Please paste your API key.'); return; }
    API_KEY = k;
    localStorage.setItem('jarvis_key', k);
    showApp();
  }

  function showApp() {
    document.getElementById('keyScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'flex';
  }

  function showErr(msg) {
    const e = document.getElementById('keyErr');
    e.textContent = '⚠ ' + msg;
    e.style.display = 'block';
  }

  // Allow Enter on key input
  document.getElementById('keyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveKey();
  });

  // Clock
  setInterval(() => {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-US', {hour12:false});
  }, 1000);

  // ── SPEAK (Android-safe chunked) ──
  let keepAliveTimer = null;

  function getVoice() {
    const vox = window.speechSynthesis.getVoices();
    return vox.find(v =>
      v.lang === 'en-GB' ||
      ['daniel','george','oliver','british'].some(n => v.name.toLowerCase().includes(n))
    ) || vox.find(v => v.lang.startsWith('en')) || null;
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    clearInterval(keepAliveTimer);
    speaking = true;
    setStatus('🔊 SPEAKING...');

    const clean = text.replace(/[*_`#>]/g,'').replace(/\n+/g,' ').trim();
    const chunks = clean.match(/[^.!?]+[.!?]*/g) || [clean];
    let i = 0;

    const speakChunk = () => {
      if (i >= chunks.length) {
        clearInterval(keepAliveTimer);
        speaking = false;
        setStatus('TAP MIC TO SPEAK');
        return;
      }
      const chunk = chunks[i].trim();
      if (!chunk) { i++; speakChunk(); return; }
      const u = new SpeechSynthesisUtterance(chunk);
      u.rate = 0.92; u.pitch = 0.82; u.volume = 1;
      const v = getVoice();
      if (v) u.voice = v;
      clearInterval(keepAliveTimer);
      keepAliveTimer = setInterval(() => {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }
      }, 10000);
      u.onend = () => { i++; speakChunk(); };
      u.onerror = () => { i++; speakChunk(); };
      window.speechSynthesis.speak(u);
    };

    const vox = window.speechSynthesis.getVoices();
    if (vox.length > 0) speakChunk();
    else {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.onvoiceschanged = null;
        speakChunk();
      };
    }
  }


  // ── MIC ──
  function toggleMic() {
    if (speaking) { window.speechSynthesis?.cancel(); speaking = false; }
    listening ? stopMic() : startMic();
  }

  function startMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setStatus('⚠ USE CHROME FOR MIC'); return; }

    recog = new SR();
    recog.continuous = false;
    recog.interimResults = true;
    recog.lang = 'en-US';

    recog.onstart = () => {
      listening = true;
      document.getElementById('bigMic').classList.add('listening');
      document.getElementById('bigMic').textContent = '🔴';
      setStatus('🎤 LISTENING...');
    };

    recog.onresult = (e) => {
      const t = Array.from(e.results).map(r => r[0].transcript).join('');
      document.getElementById('userInput').value = t;
      autoResize(document.getElementById('userInput'));
      if (e.results[e.results.length - 1].isFinal) {
        stopMic();
        setTimeout(sendMessage, 250);
      }
    };

    recog.onerror = (e) => {
      stopMic();
      setStatus(e.error === 'not-allowed' ? '⛔ MIC BLOCKED — ALLOW IN SETTINGS' : 'TAP MIC TO SPEAK');
    };

    recog.onend = () => stopMic();
    try { recog.start(); } catch(e) { stopMic(); }
  }

  function stopMic() {
    listening = false;
    const btn = document.getElementById('bigMic');
    btn.classList.remove('listening');
    btn.textContent = '🎤';
    if (!speaking) setStatus('TAP MIC TO SPEAK');
    try { recog?.stop(); } catch(e) {}
  }

  function setStatus(t) { document.getElementById('micStatus').textContent = t; }

  // ── UI ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function quickSend(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  function addMsg(role, text) {
    document.getElementById('welcome')?.remove();
    const chat = document.getElementById('chat');
    const w = document.createElement('div');
    w.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
    const l = document.createElement('div');
    l.className = 'msg-lbl'; l.textContent = role === 'user' ? 'YOU' : 'J.A.R.V.I.S';
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = text;
    w.appendChild(l); w.appendChild(b);
    chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
  }

  function showThinking() {
    document.getElementById('welcome')?.remove();
    const chat = document.getElementById('chat');
    const w = document.createElement('div');
    w.className = 'msg ai'; w.id = 'thinking';
    const l = document.createElement('div');
    l.className = 'msg-lbl'; l.textContent = 'J.A.R.V.I.S';
    const b = document.createElement('div');
    b.className = 'thinking';
    b.innerHTML = `PROCESSING <div class="dots"><span></span><span></span><span></span></div>`;
    w.appendChild(l); w.appendChild(b);
    chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
  }

  // ── SEND ──
  async function sendMessage() {
    const inp = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const text = inp.value.trim();
    if (!text) return;

    inp.value = ''; inp.style.height = 'auto';
    btn.disabled = true;
    setStatus('⏳ PROCESSING...');

    addMsg('user', text);
    msgs.push({ role: 'user', parts: [{ text }] });
    document.getElementById('msgCount').textContent = `MSGS: ${++count}`;
    showThinking();

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYS }] },
          contents: msgs
        })
      });

      const data = await res.json();
      document.getElementById('thinking')?.remove();

      if (data.error) {
        // Bad API key
        const errTxt = data.error.message || 'API error';
        addMsg('ai', `Error: ${errTxt}. Tap here to re-enter your API key.`);
        localStorage.removeItem('jarvis_key');
        speak('There was an API error, sir.');
        btn.disabled = false;
        setStatus('TAP MIC TO SPEAK');
        return;
      }

      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Systems malfunction, sir.";
      msgs.push({ role: 'model', parts: [{ text: reply }] });
      addMsg('ai', reply);
      document.getElementById('msgCount').textContent = `MSGS: ${++count}`;
      speak(reply);

    } catch(err) {
      document.getElementById('thinking')?.remove();
      addMsg('ai', 'Network error, sir. Check your internet connection and try again.');
      speak('Network error, sir.');
    }

    btn.disabled = false;
    setStatus('TAP MIC TO SPEAK');
  }
</script>
</body>
</html>
